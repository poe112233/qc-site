<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Gallery - Product Quality Control</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <span class="logo">QC Gallery</span>
    <p class="subtitle">Product Quality Control Documentation</p>
  </div>
</header>
<main>
  <section class="products-section" id="products">
    <div class="filter-bar">
      <input type="text" id="search" placeholder="Search by ID or name...">
      <span class="count" id="count"></span>
    </div>
    <div class="products-grid" id="grid">
      <div class="loading">Loading...</div>
    </div>
  </section>
</main>
<footer class="site-footer">
  <p>QC &copy; 2026</p>
</footer>
<script src="/js/home.js"></script>
</body>
</html>
